<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>本地任务看板</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">AGENT AUTOLOOP / 本机</p>
        <h1>任务看板</h1>
      </div>
      <div class="toolbar">
        <span id="status" role="status" aria-live="polite">正在读取…</span
        ><button id="refresh" type="button">立即刷新</button>
      </div>
    </header>
    <main>
      <section id="summary" aria-label="汇总"></section>
      <section id="waiting" class="panel">
        <h2>待我处理</h2>
        <p>正在读取…</p>
      </section>
      <section id="detail" class="panel" hidden aria-label="卡片详情"></section>
      <section id="scheduled" class="panel"><h2>定时任务</h2></section>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
