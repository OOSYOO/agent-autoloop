<text x="36" y="207" class="heading" style="fill:#8596a5">01</text>
<text x="36" y="240" class="heading">交互层</text>
<text x="36" y="268" class="small muted">人作决定</text>
<text x="36" y="357" class="heading" style="fill:#8596a5">02</text>
<text x="36" y="390" class="heading">调度层</text>
<text x="36" y="418" class="small muted">状态与派单</text>
<text x="36" y="565" class="heading" style="fill:#8596a5">03</text>
<text x="36" y="598" class="heading">执行层</text>
<text x="36" y="626" class="small muted">插件与模型</text>
<text x="36" y="891" class="heading" style="fill:#8596a5">04</text>
<text x="36" y="924" class="heading">数据层</text>
<text x="36" y="952" class="small muted">各自持有</text>
<rect x="205" y="182" width="515" height="88" rx="14" fill="#fff" stroke="#cfdae4"/>
<text x="223" y="212" class="label">本人 · 既有飞书通道 / CLI</text>
<text x="223" y="239" class="small muted">看 findings、确认发布评论、停止任务</text>
<text x="788" y="215" class="label" style="fill:#a46b30">不新增通知通道或界面</text>
<text x="788" y="244" class="small muted">服务器无需飞书凭据或本人密钥</text>
<rect x="1210" y="182" width="177" height="88" rx="14" fill="#edf3f8" stroke="#cbd9e5"/>
<text x="1228" y="212" class="label">飞书</text>
<text x="1228" y="239" class="small muted">沿用现有连接</text>
<rect x="205" y="327" width="515" height="150" rx="14" fill="#fff" stroke="#cfdae4"/>
<text x="223" y="357" class="label">host/up.ts + kernel/ · 保持不变</text>
<text x="223" y="384" class="small muted">只收事件、分事项、派任务、记事实</text>
<text x="223" y="408" class="small muted">cron / 队列 / 并发 / 失败重派 / 卡片</text>
<text x="223" y="432" class="small muted">规则是指令；内核不主动请求 GitLab</text>
<rect x="788" y="327" width="360" height="150" rx="14" fill="#fff7ec" stroke="#e2b57c"/>
<text x="806" y="357" class="label">worker/worker.ts · 远程接单</text>
<text x="806" y="384" class="small muted">主动领活、心跳、启动与停止进程</text>
<text x="806" y="408" class="small muted">保存执行记录，重启后恢复跟踪</text>
<text x="806" y="432" class="small muted">capacity = 1；不运行第二个中台</text>
<path d="M454 327 V270" class="line"/>
<text x="468" y="303" class="small muted">卡片 / 回答</text>
<path d="M788 384 H720" class="line"/>
<text x="735" y="369" class="small muted">HTTP</text>
<text x="791" y="502" class="small muted">连接待定：受保护内网 / SSH 隧道</text>
<rect x="205" y="549" width="515" height="94" rx="14" fill="#fff" stroke="#cfdae4"/>
<text x="223" y="579" class="label">其他 Mac Worker / Agent · 保留</text>
<text x="223" y="606" class="small muted">非目标项目继续本地执行；目标项目不再重复扫描</text>
<rect x="205" y="675" width="515" height="132" rx="14" fill="#fff" stroke="#cfdae4"/>
<text x="223" y="705" class="label">本次迁移的最小完整单元</text>
<text x="223" y="732" class="small muted">目标项目的 scan + review + 本地审查数据</text>
<text x="223" y="756" class="small muted">扫描也依赖请求记录、main 和原生 Skill 指纹</text>
<text x="223" y="780" class="small muted">因此扫描与审查必须同机，不能只迁 review</text>
<rect x="788" y="549" width="360" height="97" rx="14" fill="#fff7ec" stroke="#e2b57c"/>
<text x="806" y="579" class="label">plugins/gitlab/poll.ts · 扫描</text>
<text x="806" y="606" class="small muted">读取 MR，保存 requestId / policyHash</text>
<text x="806" y="630" class="small muted">POST /v1/events → Mac 中台</text>
<rect x="788" y="665" width="360" height="143" rx="14" fill="#fff7ec" stroke="#e2b57c"/>
<text x="806" y="695" class="label">run.ts + resume.ts · 审查流程</text>
<text x="806" y="722" class="small muted">读取 Git 对象 → 本机 Codex → 保存报告</text>
<text x="806" y="746" class="small muted">用户确认后：复核版本 → 发布评论</text>
<text x="806" y="770" class="small muted">只读审查；不运行 MR 代码或测试</text>
<path d="M1127 477 V549" class="move"/>
<path d="M960 646 V665" class="move"/>
<text x="975" y="661" class="small muted">中台排队后执行</text>
<rect x="1210" y="549" width="177" height="259" rx="14" fill="#edf3f8" stroke="#cbd9e5"/>
<text x="1228" y="579" class="label">GitLab</text>
<text x="1228" y="606" class="small muted">MR / Diff / CI</text>
<text x="1228" y="630" class="small muted">可信 main 对象</text>
<text x="1228" y="654" class="small muted"></text>
<text x="1228" y="678" class="small muted">读取资料</text>
<text x="1228" y="702" class="small muted"></text>
<text x="1228" y="726" class="small muted">批准后发评论</text>
<text x="1228" y="750" class="small muted">不提交修复代码</text>
<path d="M1148 589 H1210" class="line"/>
<text x="1155" y="576" class="small muted">读取</text>
<path d="M1148 745 H1210" class="line"/>
