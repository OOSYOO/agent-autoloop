<text x="806" y="1085" class="label">本地 rules.json · 只读部署副本</text>
<path d="M720 1080 H788" class="line"/>
<text x="733" y="1065" class="small muted">部署</text>
<rect x="32" y="1152" width="1376" height="96" rx="14" fill="#203345" stroke="#203345"/>
<text x="54" y="1183" class="label" style="fill:#fff">影响边界</text>
<text x="164" y="1183" class="body" style="fill:#fff">内核 0 变更  ·  HTTP 协议 0 变更  ·  调整路由、部署配置与数据归属</text>
<text x="54" y="1217" class="small" style="fill:#cad8e3">运行限制：Mac 离线时不能继续派单或确认；已启动任务可能继续，结果落盘后等待重连。</text>
<text x="34" y="1269" class="small muted">¹ 目标主机标识与运行环境待核实。图表示拟定部署，不表示已接入。评论发布仍需人工确认；没有自动修复、合并或发布。</text>
