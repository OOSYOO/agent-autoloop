<rect x="205" y="872" width="248" height="135" rx="14" fill="#fff" stroke="#cfdae4"/>
<text x="223" y="902" class="label">中台事实与规则</text>
<text x="223" y="929" class="small muted">hub.db：事项 / 轮次 / 卡片</text>
<text x="223" y="953" class="small muted">rules.json：唯一编辑源</text>
<text x="223" y="977" class="small muted">Hub / 通道凭据留在 Mac</text>
<rect x="470" y="872" width="250" height="135" rx="14" fill="#fff" stroke="#cfdae4"/>
<text x="488" y="902" class="label">保留的本地资料</text>
