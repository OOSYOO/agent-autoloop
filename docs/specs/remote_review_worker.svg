<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1280" viewBox="0 0 1440 1280" role="img" aria-labelledby="title desc">
<title id="title">远程审查 Worker：分层架构与影响范围</title>
<desc id="desc">Mac 保留交互和中台调度；开发服务器承接扫描、审查、Codex 以及本地审查数据。服务器主动连接 Mac，内核及 HTTP 协议不变。GitLab 提供 MR，评论经人工确认后发布。本期不自动修复。</desc>
<defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#203345} .muted{fill:#657789} .small{font-size:15px} .label{font-size:17px;font-weight:600} .heading{font-size:21px;font-weight:700} .body{font-size:17px} .line{fill:none;stroke:#527086;stroke-width:2;marker-end:url(#arrow)} .move{fill:none;stroke:#be6c26;stroke-width:2.5;marker-end:url(#orange)} </style>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#527086"/></marker>
<marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#be6c26"/></marker></defs>
<rect width="1440" height="1280" fill="#f5f7fa"/>

<text x="40" y="53" class="heading">远程审查 Worker</text>
<text x="40" y="88" class="body muted">改变执行地点，不改变中台职责与通信协议。首期只审查，自动修复不在范围内。</text>
<rect x="1005" y="31" width="18" height="18" rx="4" fill="#fff7ec" stroke="#e2b57c"/>
<text x="1033" y="46" class="small">迁到服务器</text>
<rect x="1177" y="31" width="18" height="18" rx="4" fill="#fff" stroke="#cfdae4"/>
<text x="1205" y="46" class="small">继续留在 Mac</text>
<rect x="182" y="119" width="565" height="1008" rx="18" fill="#edf3f8" stroke="#edf3f8"/>
<rect x="766" y="119" width="405" height="1008" rx="18" fill="#fcf1e3" stroke="#fcf1e3"/>
<rect x="1190" y="119" width="218" height="1008" rx="18" fill="#edf1f5" stroke="#edf1f5"/>
<text x="205" y="156" class="heading">Mac · 现有实例</text>
<text x="789" y="156" class="heading">开发服务器 · ek001-139¹</text>
<text x="1211" y="156" class="heading">外部系统</text>
