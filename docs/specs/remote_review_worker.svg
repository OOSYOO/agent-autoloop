<text x="488" y="953" class="small muted">目标项目旧报告留档</text>
<text x="488" y="977" class="small muted">不复制活动轮次到服务器</text>
<rect x="788" y="872" width="360" height="164" rx="14" fill="#fff7ec" stroke="#e2b57c"/>
<text x="806" y="902" class="label">服务器持久目录 · 随任务归属</text>
<text x="806" y="929" class="small muted">worker/runs：进程记录与待交回执</text>
<text x="806" y="953" class="small muted">dataRoot/gitlab：请求 / 报告 / 发布记录</text>
<text x="806" y="977" class="small muted">裸 Git 缓存 + 专用 main 审查工作树</text>
<text x="806" y="1001" class="small muted">原生 Codex 配置 / Skill / GitLab 凭据</text>
